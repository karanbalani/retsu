[package]
name = "retsu"
version = "2026.7.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
actix-web = "4.14.0"
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
moka = { version = "0.12.15", features = ["future"] }
opentelemetry = { version = "0.32.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry-prometheus = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "metrics"] }
redis = { version = "1.4.1", default-features = false, features = ["connection-manager", "tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [ "macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
validator = { version = "0.21.0", features = ["derive"] }
prometheus = { version = "0.14.0", default-features = false }
uuid = { version = "1.24.0", features = ["v4", "serde", "v7"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
