[package]
name = "retsu"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
validator = { version = "0.20.0", features = ["derive"] }
