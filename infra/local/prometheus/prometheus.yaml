global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  scrape_native_histograms: true

scrape_configs:
  - job_name: retsu
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:2424
        labels:
          deployment_environment: local
          process_mode: api

      - targets:
          - host.docker.internal:24247
        labels:
          deployment_environment: local
          process_mode: worker

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
