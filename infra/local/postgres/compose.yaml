x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    labels:
      retsu.observability.component: postgres
    command:
      - postgres
      - -c
      - "max_connections=${RETSU_LOCAL_POSTGRES_MAX_CONNECTIONS:-100}"
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - "log_line_prefix=%m [%p] db=%d user=%u app=%a query_id=%Q|"
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
      - -c
      - log_temp_files=0
      - -c
      - "log_min_duration_statement=${RETSU_LOCAL_POSTGRES_SLOW_QUERY_MS:--1}"
    environment:
      POSTGRES_DB: ${RETSU_LOCAL_POSTGRES_DB:-retsu}
      POSTGRES_USER: ${RETSU_LOCAL_POSTGRES_USER:-retsu}
      POSTGRES_PASSWORD: ${RETSU_LOCAL_POSTGRES_PASSWORD:-retsu_local}
      POSTGRES_MONITOR_USER: ${RETSU_LOCAL_POSTGRES_MONITOR_USER:-retsu_monitor}
      POSTGRES_MONITOR_PASSWORD: ${RETSU_LOCAL_POSTGRES_MONITOR_PASSWORD:-retsu_monitor_local}
    ports:
      - "127.0.0.1:${RETSU_LOCAL_POSTGRES_PORT:-24240}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init/observability.sh:/docker-entrypoint-initdb.d/observability.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s
    cpus: "${RETSU_LOCAL_POSTGRES_CPUS:-2}"
    mem_limit: ${RETSU_LOCAL_POSTGRES_MEMORY:-1g}
    pids_limit: ${RETSU_LOCAL_POSTGRES_PIDS:-256}
    networks:
      - backend
    logging: *default-logging
