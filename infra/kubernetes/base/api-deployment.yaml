apiVersion: apps/v1
kind: Deployment
metadata:
  name: retsu-api
  labels:
    app.kubernetes.io/name: retsu
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: retsu
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: retsu
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retsu
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: retsu
    spec:
      serviceAccountName: retsu
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: retsu
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/karanbalani/retsu
          imagePullPolicy: IfNotPresent
          command:
            - retsu
          args:
            - --config
            - /etc/retsu/retsu.yaml
            - api
          env:
            - name: RETSU_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: retsu-secrets
                  key: RETSU_DATABASE_URL
          ports:
            - name: http
              containerPort: 2424
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/retsu
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: retsu-config
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
