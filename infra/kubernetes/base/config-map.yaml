apiVersion: v1
kind: ConfigMap
metadata:
  name: retsu-config
  labels:
    app.kubernetes.io/name: retsu
    app.kubernetes.io/part-of: retsu
data:
  retsu.yaml: |
    environment: production

    http:
      bind_address: 0.0.0.0
      port: 2424

    logging:
      filter: info
      format: json

    telemetry:
      metrics:
        max_queues: 10000
      traces:
        enabled: false
        filter: info
        endpoint: http://127.0.0.1:4317
        timeout_seconds: 5

    cache:
      in_memory:
        enabled: true
        regions:
          queue_names:
            max_entries: 10000
            max_capacity_bytes: 8388608
      distributed:
        enabled: true
        url: redis://dragonfly:6379
        connection_timeout_milliseconds: 500
        command_timeout_milliseconds: 20

    database:
      max_connections: 10
      acquire_timeout_seconds: 5

    worker:
      shutdown_timeout_seconds: 30
      management:
        bind_address: 0.0.0.0
        port: 24247
