apiVersion: apps/v1
kind: Deployment
metadata:
  name: retsu-expired-message-cleaner
  labels:
    app.kubernetes.io/name: retsu
    app.kubernetes.io/component: expired-message-cleaner
    app.kubernetes.io/part-of: retsu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retsu
      app.kubernetes.io/component: expired-message-cleaner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retsu
        app.kubernetes.io/component: expired-message-cleaner
        app.kubernetes.io/part-of: retsu
    spec:
      serviceAccountName: retsu
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: expired-message-cleaner
          image: ghcr.io/karanbalani/retsu
          imagePullPolicy: IfNotPresent
          command:
            - retsu
          args:
            - --config
            - /etc/retsu/retsu.yaml
            - worker
            - run
            - queue
            - expired-message-cleaner
          env:
            - name: RETSU_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: retsu-secrets
                  key: RETSU_DATABASE_URL
          ports:
            - name: management
              containerPort: 24247
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/retsu
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: retsu-config
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
