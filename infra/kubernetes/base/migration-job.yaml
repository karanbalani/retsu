apiVersion: batch/v1
kind: Job
metadata:
  name: retsu-migrate
  labels:
    app.kubernetes.io/name: retsu
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: retsu
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retsu
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: retsu
    spec:
      serviceAccountName: retsu
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/karanbalani/retsu
          imagePullPolicy: IfNotPresent
          command:
            - retsu
          args:
            - --config
            - /etc/retsu/retsu.yaml
            - migrate
          env:
            - name: RETSU_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: retsu-secrets
                  key: RETSU_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/retsu
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: retsu-config
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
