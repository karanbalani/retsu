name: Container Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate calendar version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pattern='^v([1-9][0-9]{3})\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'

          if [[ ! "${RELEASE_TAG}" =~ ${pattern} ]]; then
            echo "Tag must match vYEAR.MONTH.RELEASE, for example v2026.7.0."
            exit 1
          fi

          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Verify tagged commit is on main
        id: commit
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"

          if ! git merge-base --is-ancestor "${tagged_commit}" refs/remotes/origin/main; then
            echo "Tagged commit must be contained in origin/main."
            exit 1
          fi

          echo "sha=${tagged_commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=sha-${{ steps.commit.outputs.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to do."
            exit 0
          fi

          release_notes="Container image: \`${IMAGE_NAME}:${RELEASE_TAG#v}\`"

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}" \
            --notes "${release_notes}"
