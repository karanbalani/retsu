name: Integration Tests

on:
  pull_request:
    types:
      - labeled
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  integration:
    name: Integration tests
    if: >-
      github.event_name == 'push' ||
      github.event.label.name == 'run-integration-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Restore Rust dependency and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run integration tests
        run: >-
          cargo test --locked --test integration --all-features
          -- --test-threads=1
