name: Integration Tests

on:
  pull_request:
    types:
      - labeled
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TEST_IMAGE: retsu-integration:${{ github.sha }}

jobs:
  integration:
    name: Integration tests
    if: >-
      github.event_name == 'push' ||
      github.event.label.name == 'run-integration-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Restore Rust dependency and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests against the image
        env:
          RETSU_TEST_IMAGE: ${{ env.TEST_IMAGE }}
        run: >-
          cargo test --locked --test integration --all-features
          -- --test-threads=1

      - name: Remove local test image
        if: always()
        run: docker image rm --force "${TEST_IMAGE}" || true
