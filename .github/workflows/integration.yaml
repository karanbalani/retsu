name: Integration Tests

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/integration.yaml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - build.rs
      - migrations/**
      - rust-toolchain.toml
      - src/**
      - tests/container-runtime.sh

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_IMAGE: retsu-pr-integration:${{ github.sha }}

jobs:
  integration:
    name: Container image integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container image integration test
        run: bash tests/container-runtime.sh "${TEST_IMAGE}"

      - name: Remove local test image
        if: always()
        run: docker image rm --force "${TEST_IMAGE}" || true
