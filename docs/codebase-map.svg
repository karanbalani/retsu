<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title description">
  <title id="title">Horizontal and vertical components of the Retsu codebase</title>
  <desc id="description">
    Shared runtime components run horizontally across the program. The queue
    module is a vertical feature component containing its API handlers, workers,
    application operations, domain rules, and PostgreSQL implementation.
  </desc>

  <defs>
    <marker id="runtime-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="connection-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="feature-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .page-title {
        fill: #0f172a;
        font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .page-subtitle {
        fill: #475569;
        font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .panel-title {
        fill: #0f172a;
        font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.4px;
      }
      .panel-path {
        fill: #334155;
        font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .section-label {
        fill: #475569;
        font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-title {
        fill: #0f172a;
        font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-path {
        fill: #475569;
        font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .box-note {
        fill: #475569;
        font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .bridge-title {
        fill: #9a3412;
        font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .bridge-note {
        fill: #7c2d12;
        font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      .runtime-arrow {
        fill: none;
        stroke: #2563eb;
        stroke-width: 2.5;
        marker-end: url(#runtime-arrowhead);
      }
      .connection-arrow {
        fill: none;
        stroke: #c2410c;
        stroke-width: 2.5;
        marker-end: url(#connection-arrowhead);
      }
      .feature-arrow {
        fill: none;
        stroke: #7c3aed;
        stroke-width: 2.5;
        marker-end: url(#feature-arrowhead);
      }
    </style>
  </defs>

  <rect width="1400" height="1100" fill="#f8fafc"/>

  <text class="page-title" x="60" y="58">How the codebase is split</text>
  <text class="page-subtitle" x="60" y="92">
    Shared runtime code supports the program horizontally; feature code owns behavior vertically.
  </text>

  <rect x="50" y="130" width="1300" height="350" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <path d="M 68 130 H 1332 Q 1350 130 1350 148 V 200 H 50 V 148 Q 50 130 68 130 Z" fill="#dbeafe"/>
  <text class="panel-title" x="80" y="164">HORIZONTAL RUNTIME COMPONENTS</text>
  <text class="panel-path" x="80" y="188">shared startup and support code outside application modules</text>

  <text class="section-label" x="90" y="226">A command selects one process mode</text>

  <rect class="box" x="90" y="242" width="260" height="96" rx="12"/>
  <text class="box-title" x="220" y="273" text-anchor="middle">CLI and dispatch</text>
  <text class="box-path" x="220" y="299" text-anchor="middle">src/cli.rs</text>
  <text class="box-path" x="220" y="319" text-anchor="middle">src/entrypoints/dispatch.rs</text>

  <rect class="box" x="410" y="242" width="260" height="96" rx="12"/>
  <text class="box-title" x="540" y="273" text-anchor="middle">Selected entrypoint</text>
  <text class="box-path" x="540" y="299" text-anchor="middle">src/entrypoints/</text>

  <rect class="box" x="730" y="242" width="570" height="96" rx="12"/>
  <text class="box-title" x="1015" y="273" text-anchor="middle">Runs exactly one process</text>
  <text class="box-note" x="1015" y="298" text-anchor="middle">API · one named worker · migration</text>
  <text class="box-path" x="1015" y="319" text-anchor="middle">src/entrypoints/api.rs · worker.rs · migrate.rs</text>

  <path class="runtime-arrow" d="M 350 290 H 410"/>
  <path class="runtime-arrow" d="M 670 290 H 730"/>

  <text class="section-label" x="90" y="357">Shared services used by the running processes</text>

  <rect class="box" x="90" y="373" width="224" height="78" rx="12"/>
  <text class="box-title" x="202" y="403" text-anchor="middle">Configuration</text>
  <text class="box-path" x="202" y="428" text-anchor="middle">src/configuration/</text>

  <rect class="box" x="334" y="373" width="224" height="78" rx="12"/>
  <text class="box-title" x="446" y="397" text-anchor="middle">ApplicationContext</text>
  <text class="box-note" x="446" y="419" text-anchor="middle">manual dependency injection</text>
  <text class="box-path" x="446" y="439" text-anchor="middle">src/app/mod.rs</text>

  <rect class="box" x="578" y="373" width="224" height="78" rx="12"/>
  <text class="box-title" x="690" y="403" text-anchor="middle">Database setup</text>
  <text class="box-path" x="690" y="428" text-anchor="middle">src/database/</text>

  <rect class="box" x="822" y="373" width="224" height="78" rx="12"/>
  <text class="box-title" x="934" y="403" text-anchor="middle">HTTP + worker runtime</text>
  <text class="box-path" x="934" y="428" text-anchor="middle">src/http/ · src/worker/</text>

  <rect class="box" x="1066" y="373" width="244" height="78" rx="12"/>
  <text class="box-title" x="1188" y="397" text-anchor="middle">Monitoring + shutdown</text>
  <text class="box-path" x="1188" y="419" text-anchor="middle">observability/ · management/</text>
  <text class="box-path" x="1188" y="439" text-anchor="middle">src/shutdown.rs</text>

  <rect x="350" y="510" width="700" height="84" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="bridge-title" x="700" y="542" text-anchor="middle">THE CONNECTION BETWEEN BOTH SHAPES</text>
  <text class="bridge-note" x="700" y="570" text-anchor="middle">
    src/modules/ lists routes and workers · ApplicationContext provides QueueModule
  </text>
  <path class="connection-arrow" d="M 700 480 V 510"/>
  <path class="connection-arrow" d="M 700 594 V 708"/>

  <rect x="240" y="630" width="920" height="420" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 258 630 H 1142 Q 1160 630 1160 648 V 700 H 240 V 648 Q 240 630 258 630 Z" fill="#ede9fe"/>
  <text class="panel-title" x="270" y="664">VERTICAL FEATURE COMPONENT</text>
  <text class="panel-path" x="270" y="688">queue module · src/modules/queue/ · owns one feature end to end</text>

  <rect class="box" x="285" y="728" width="220" height="82" rx="12"/>
  <text class="box-title" x="395" y="759" text-anchor="middle">API handlers</text>
  <text class="box-path" x="395" y="784" text-anchor="middle">queue/api/</text>

  <rect class="box" x="590" y="728" width="220" height="82" rx="12"/>
  <text class="box-title" x="700" y="753" text-anchor="middle">QueueModule</text>
  <text class="box-note" x="700" y="775" text-anchor="middle">module entry point</text>
  <text class="box-path" x="700" y="796" text-anchor="middle">queue/mod.rs</text>

  <rect class="box" x="895" y="728" width="220" height="82" rx="12"/>
  <text class="box-title" x="1005" y="759" text-anchor="middle">Worker jobs</text>
  <text class="box-path" x="1005" y="784" text-anchor="middle">queue/worker/</text>

  <rect class="box" x="590" y="848" width="220" height="82" rx="12"/>
  <text class="box-title" x="700" y="879" text-anchor="middle">Application operations</text>
  <text class="box-path" x="700" y="904" text-anchor="middle">queue/application/</text>

  <rect class="box" x="365" y="958" width="270" height="72" rx="12"/>
  <text class="box-title" x="500" y="987" text-anchor="middle">Domain rules</text>
  <text class="box-path" x="500" y="1011" text-anchor="middle">queue/domain/</text>

  <rect class="box" x="765" y="958" width="270" height="72" rx="12"/>
  <text class="box-title" x="900" y="987" text-anchor="middle">PostgreSQL repository</text>
  <text class="box-path" x="900" y="1011" text-anchor="middle">queue/infrastructure/</text>

  <path class="feature-arrow" d="M 505 769 H 590"/>
  <path class="feature-arrow" d="M 895 769 H 810"/>
  <path class="feature-arrow" d="M 700 810 V 848"/>
  <path class="feature-arrow" d="M 660 930 C 660 946 560 946 540 958"/>
  <path class="feature-arrow" d="M 740 930 C 740 946 840 946 860 958"/>
</svg>
