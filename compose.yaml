x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    labels:
      retsu.observability.component: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - "log_line_prefix=%m [%p] db=%d user=%u app=%a query_id=%Q|"
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
      - -c
      - log_temp_files=0
      - -c
      - "log_min_duration_statement=${RETSU_LOCAL_POSTGRES_SLOW_QUERY_MS:--1}"
    environment:
      POSTGRES_DB: ${RETSU_LOCAL_POSTGRES_DB:-retsu}
      POSTGRES_USER: ${RETSU_LOCAL_POSTGRES_USER:-retsu}
      POSTGRES_PASSWORD: ${RETSU_LOCAL_POSTGRES_PASSWORD:-retsu_local}
      POSTGRES_MONITOR_USER: ${RETSU_LOCAL_POSTGRES_MONITOR_USER:-retsu_monitor}
      POSTGRES_MONITOR_PASSWORD: ${RETSU_LOCAL_POSTGRES_MONITOR_PASSWORD:-retsu_monitor_local}
    ports:
      - "127.0.0.1:${RETSU_LOCAL_POSTGRES_PORT:-24240}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/local/postgres/init/observability.sh:/docker-entrypoint-initdb.d/observability.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - backend
    logging: *default-logging

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.0
    labels:
      retsu.observability.component: distributed-cache
    command:
      - --cache_mode=true
      - --maxmemory=256mb
      - --proactor_threads=1
      - --primary_port_http_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:${RETSU_LOCAL_DISTRIBUTED_CACHE_PORT:-24251}:6379"
    stop_grace_period: 5s
    networks:
      - backend
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    profiles:
      - observability
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=true
      - --containerd=/rootfs/run/docker/containerd/containerd.sock
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:${RETSU_LOCAL_CADVISOR_PORT:-24249}:8080"
    networks:
      - observability
    stop_grace_period: 10s
    logging: *default-logging

  pg-exporter:
    image: pgsty/pg_exporter:1.4.0
    profiles:
      - observability
    environment:
      PG_EXPORTER_URL: "postgresql://${RETSU_LOCAL_POSTGRES_MONITOR_USER:-retsu_monitor}:${RETSU_LOCAL_POSTGRES_MONITOR_PASSWORD:-retsu_monitor_local}@postgres:5432/${RETSU_LOCAL_POSTGRES_DB:-retsu}?sslmode=disable&application_name=pg_exporter"
      PG_EXPORTER_CONFIG: /etc/pg_exporter.yml
      PG_EXPORTER_AUTO_DISCOVERY: "false"
      PG_EXPORTER_CONNECT_TIMEOUT: "1000"
      PG_EXPORTER_FAIL_FAST: "false"
    ports:
      - "127.0.0.1:${RETSU_LOCAL_PG_EXPORTER_PORT:-24248}:9630"
    expose:
      - "9630"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    networks:
      - backend
      - observability
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/local/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${RETSU_LOCAL_PROMETHEUS_PORT:-24245}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9090/-/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - observability
    logging: *default-logging

  tempo:
    image: grafana/tempo:3.0.2
    profiles:
      - observability
    command:
      - -target=all
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./infra/local/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${RETSU_LOCAL_TEMPO_PORT:-24244}:3200"
    expose:
      - "4317"
      - "4318"
    depends_on:
      prometheus:
        condition: service_healthy
    stop_grace_period: 10s
    networks:
      - observability
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    profiles:
      - observability
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./infra/local/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${RETSU_LOCAL_OTLP_GRPC_PORT:-24241}:4317"
      - "127.0.0.1:${RETSU_LOCAL_OTLP_HTTP_PORT:-24242}:4318"
      - "127.0.0.1:${RETSU_LOCAL_OTEL_HEALTH_PORT:-24243}:13133"
    expose:
      - "8888"
    depends_on:
      tempo:
        condition: service_started
    stop_grace_period: 10s
    networks:
      - observability
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.1
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${RETSU_LOCAL_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${RETSU_LOCAL_GRAFANA_PASSWORD:-retsu_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/local/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${RETSU_LOCAL_GRAFANA_PORT:-24246}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    stop_grace_period: 10s
    networks:
      - observability
    logging: *default-logging

networks:
  backend:
    driver: bridge

  observability:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  tempo-data:
  grafana-data:
