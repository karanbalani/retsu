environment: local

http:
  bind_address: 127.0.0.1
  port: 2424

logging:
  filter: info
  format: pretty

telemetry:
  traces:
    enabled: false
    filter: info
    endpoint: http://127.0.0.1:4317
    timeout_seconds: 5

database:
  url: postgres://retsu@127.0.0.1:5432/retsu
  max_connections: 10
  acquire_timeout_seconds: 5
