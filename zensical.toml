[project]
site_name = "Retsu"
site_description = "An observable, distributed priority queue"
site_url = "https://karanbalani.github.io/retsu/"
repo_url = "https://github.com/karanbalani/retsu"
repo_name = "karanbalani/retsu"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Use Retsu" = [
    { "Queues and messages" = "queues.md" },
    { "Message lifecycle" = "message-lifecycle.md" },
  ] },
  { "Run Retsu" = [
    { "Configuration" = "configuration.md" },
    { "Workers" = "workers.md" },
    { "Local development" = "local-development.md" },
    { "Deployment and releases" = "deployment.md" },
    { "Monitoring" = "observability.md" },
    { "Load testing" = "load-testing.md" },
  ] },
  { "Understand the code" = [
    { "Architecture" = "architecture.md" },
    { "Codebase guide" = "codebase-guide.md" },
    { "Caching" = "caching.md" },
    { "Queue state summaries" = "queue-state-rollups.md" },
    { "Queue metric limits" = "queue-metric-cardinality.md" },
    { "State collector failover" = "queue-state-collector-leadership.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
